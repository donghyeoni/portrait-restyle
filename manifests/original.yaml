# 원본 사진 자체를 카드로 등록한다 (N 등급). AI 생성이 없다 — 엔진 original.
# 업로드한 사진을 카드 규격(896x1152)으로 인물 중심 크롭하고 누끼를 딴다. 그게 전부다.
#   크롭: steps/crop.py 의 upper_body_box (얼굴 bbox 기준 상반신, 직업·12지신 참고본과 같은 규격)
#   누끼: 사용자 사진이라 사전 마스크가 없으니 BiRefNet(cutout-cpu)로 무조건 딴다
# GPU 가 필요 없어 EC2 CPU 에서만 돈다 (manifests/__init__.py EXECUTION_TARGET).
id: original
display: 원본
tier: N
version: original-v1
engine: original
enabled: true

output:
  width: 896
  height: 1152
  dir: data/output/original     # {man,woman}/NNN/original.png (로컬 배치용)

presets:
  ORIGINAL:
    key: original
    # 카드 규격으로 인물 중심 크롭할 때의 얼굴 높이 배수 (steps/crop.py 기본값과 동일).
    above: 1.0
    below: 3.2
