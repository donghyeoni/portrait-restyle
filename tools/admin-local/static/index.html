<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카드 생성 모니터</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/cardface/cardface.css" onerror="this.remove()" />
</head>
<body>
  <div class="shell">
    <header class="shell__header">
      <div>
        <h1>카드 생성 도구 <span class="badge">로컬</span></h1>
        <p class="muted">모니터는 운영 DB 를 읽기 전용으로 보고, 실험실은 GPU 서버에서 운영과 별도로 돌립니다.</p>
      </div>
      <nav class="tabs" aria-label="화면">
        <button type="button" class="tabs__tab" data-view="monitor" aria-current="page">모니터</button>
        <button type="button" class="tabs__tab" data-view="lab">실험실</button>
      </nav>
    </header>
    <div id="error" class="notice notice--error" hidden></div>

    <main id="view-lab" class="view" hidden>
      <div class="lab-grid">
        <section class="panel">
          <h2>실행</h2>
          <form id="lab-form" class="lab-form">
            <div class="engine-pick" id="lab-engines" role="radiogroup" aria-label="모델"></div>
            <label>화풍 <select name="stylePreset" id="lab-preset"></select></label>
            <p class="muted" id="lab-engine-help" hidden></p>
            <div class="lab-images">
              <div class="lab-source">
                <label class="drop" data-image="image">
                  <input type="file" accept="image/*" hidden />
                  <img alt="" hidden />
                  <span>입력 사진 — 끌어 놓거나 눌러서 고르세요</span>
                </label>
                <p class="muted" id="lab-from" hidden></p>
              </div>
              <label class="drop drop--ref" data-image="styleRef" hidden>
                <input type="file" accept="image/*" hidden />
                <img alt="" hidden />
                <span>화풍 참고 이미지 (선택)</span>
              </label>
              <label class="drop drop--ref" data-image="template" hidden>
                <input type="file" accept="image/*" hidden />
                <img alt="" hidden />
                <span>템플릿 / 코스튬 이미지</span>
              </label>
            </div>
            <label>성별
              <select name="gender"><option value="auto">자동 판별</option><option value="male">남</option><option value="female">여</option></select>
            </label>
            <div id="lab-fields" class="lab-fields"></div>
            <label id="lab-capture-row">중간 스텝 수 (0~6, 한 장마다 생성을 한 번 더 돌립니다) <input type="number" name="captureSteps" min="0" max="6" value="3" /></label>
            <label>메모 <input name="label" placeholder="예: guidance 3.6 비교" /></label>
            <div class="toolbar">
              <button type="submit" class="btn btn--primary" id="lab-run">실행</button>
              <button type="button" class="btn btn--ghost btn--small" id="lab-defaults">기본값으로</button>
            </div>
            <p class="muted" id="lab-setup" hidden></p>
          </form>
        </section>
        <section class="panel lab-view" id="lab-view">
          <p class="muted">모델·화풍·사진을 고르고 실행하면 입력부터 결과까지 단계별로 여기에 나옵니다.</p>
        </section>
      </div>
      <section class="panel">
        <div class="panel__head">
          <div><h2>실행 기록</h2><p class="muted">두 개 이상 체크하면 아래에 나란히 비교합니다. 기록은 이 PC 의 lab-runs/ 에만 있습니다.</p></div>
          <button type="button" class="btn btn--ghost btn--small" id="lab-history-reload">새로고침</button>
        </div>
        <div class="history" id="lab-history"></div>
        <div class="compare" id="lab-compare" hidden></div>
      </section>
    </main>

    <main id="view-monitor" class="view">
    <section class="panel" id="summary">
      <div class="panel__head">
        <div>
          <h2>요약</h2>
          <p class="muted">생성 요청 시각 기준. 생성 시간은 첫 실행 시작부터 완료까지(재시도 포함).</p>
        </div>
        <div class="toolbar">
          <select id="summary-hours" aria-label="요약 기간"></select>
          <button type="button" class="btn btn--ghost btn--small" id="summary-reload">새로고침</button>
        </div>
      </div>
      <div class="stats" id="summary-stats"></div>
      <div class="chips" id="summary-errors"></div>
      <div class="table-wrap"><table class="table table--dense" id="summary-table"></table></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>생성 항목</h2>
        <form class="filters" id="filters">
          <label>기간 <select name="hours"></select></label>
          <label>상태 <select name="status"></select></label>
          <label>등급 <select name="rarity"></select></label>
          <label>종류 <select name="generationType"></select></label>
          <label>프리셋 <input name="stylePreset" placeholder="예: CYBERPUNK" /></label>
          <label>실패 코드 <input name="errorCode" placeholder="예: NO_FACE" /></label>
          <div class="member">
            <span>회원</span>
            <div id="member-picked" hidden></div>
            <div class="search" id="member-search">
              <input id="member-q" placeholder="닉네임 또는 번호" />
              <button type="button" class="btn btn--ghost btn--small" id="member-find">찾기</button>
            </div>
            <div class="chips" id="member-results"></div>
          </div>
          <div class="filters__actions">
            <button type="submit" class="btn btn--primary btn--small">적용</button>
            <button type="button" class="btn btn--ghost btn--small" id="filters-reset">초기화</button>
          </div>
        </form>
        <div class="table-wrap"><table class="table table--dense table--clickable" id="items"></table></div>
        <p class="muted" id="items-empty" hidden></p>
        <button type="button" class="btn btn--ghost" id="items-more" hidden>더 보기</button>
      </section>

      <section class="panel detail" id="detail">
        <p class="muted">왼쪽 목록에서 항목을 고르면 단계별 결과와 실행 기록을 보여 줍니다.</p>
      </section>
    </div>
    </main>
  </div>
  <!-- 완성 카드 미리보기(선택). 없으면 카드 칸만 비어 있다. README 참고 -->
  <script type="module" src="/cardface/cardface.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
